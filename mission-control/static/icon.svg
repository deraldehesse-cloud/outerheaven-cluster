<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#00f3ff" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Outer Hexagon / Radar -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#amber)" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
  <!-- Stylized Skull / Diamond / Crosshair -->
  <path d="M256 96 L376 186 L376 326 L256 416 L136 326 L136 186 Z" fill="none" stroke="url(#cyan)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="32" fill="#00f3ff" filter="url(#glow)"/>
  <line x1="256" y1="140" x2="256" y2="372" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="170" y1="256" x2="342" y2="256" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.7"/>
</svg>
